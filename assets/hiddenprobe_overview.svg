    <text x="1057" y="592">x<tspan baseline-shift="sub" font-size="13">L</tspan>(p₂, θ)</text>
    <text x="1284" y="592">x<tspan baseline-shift="sub" font-size="13">L</tspan>(p<tspan baseline-shift="sub" font-size="13">N</tspan>, θ)</text>

